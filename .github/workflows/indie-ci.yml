# Indie Developer CI - Simple & Fast
#
# Optimized for GitHub Actions free tier (2000 min/month)
# - Fast feedback (< 2.5 minutes)
# - Essential checks only
# - Enhanced caching
# - Parallel jobs

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more request it explicitly.
permissions:
  contents: read

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Active LTS. Bump to 26 once it takes over as Active LTS.
  NODE_VERSION: "24"

jobs:
  # Quick checks (< 1 minute)
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run prebuild

      # Doctor must work from committed dist/ before any build step in this job.
      - name: Doctor smoke (no build)
        run: |
          mkdir -p .devenv
          npm run doctor -- --fast --json > .devenv/doctor-smoke.json
        continue-on-error: true

      - name: Assert doctor smoke produced output
        run: |
          if [ ! -s .devenv/doctor-smoke.json ]; then
            echo "::error::Doctor failed before build - committed dist/ may be missing or broken."
            exit 1
          fi
          echo "Doctor smoke passed ($(wc -c < .devenv/doctor-smoke.json) bytes JSON)."

      # Rebuild and compare hashes so committed dist/ cannot drift from TypeScript sources.
      - name: Verify committed dist matches sources
        run: npm run check:dist-sync

      # Catches links broken by moving or renaming a doc. Cheap, and the failure mode is
      # otherwise invisible until a reader hits a 404.
      - name: Check documentation links
        run: npm run check:doc-links

      # This repo has twice had emoji double-encoded into mojibake, once breaking the linter.
      - name: Check encoding
        run: npm run check:encoding

  # Tests (< 2 minutes)
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Build from scratch. Caching dist/ across commits is how output from old directory
      # layouts survived and made tests pass against paths the build no longer produces.
      - name: Build
        run: npm run build:clean

      - name: Run tests
        run: npm test

  # Security scan (< 1 minute)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the tip.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Verifies packages were signed by the registry. Catches tampering that a version
      # check cannot, and is cheap enough to gate on.
      - name: Verify registry signatures
        run: npm audit signatures

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stack analysis and health score (PR only, comments results)
  doctor:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # dist/ is committed; doctor runs from it without a separate build step.
      # `npm run doctor --json` passes the flag to npm, not the script. The `--` is required.
      # The doctor exits non-zero when it finds critical gaps, which is a report, not a
      # workflow failure, so the exit code is captured and re-surfaced in the summary.
      - name: Run doctor
        id: doctor
        run: |
          set -o pipefail
          mkdir -p .devenv
          npm run doctor -- --json > .devenv/health.json
        continue-on-error: true

      # `.devenv/` is a dot-directory, and upload-artifact excludes hidden files by default
      # since v4.4. Without this flag the glob matches nothing and `if-no-files-found: error`
      # fails the job, which made every pull request red while `master` stayed green - this
      # job only runs on pull requests.
      - name: Upload analysis
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: devenv-analysis
          path: .devenv/
          include-hidden-files: true
          if-no-files-found: error

      - name: Comment health score on PR
        uses: actions/github-script@v9
        if: always()
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🏥 DevEnvTemplate Health Check\n\n';

            try {
              const health = JSON.parse(fs.readFileSync('.devenv/health.json', 'utf8'));
              const score = health.healthScore?.overall ?? 0;
              const emoji = score >= 80 ? '🟢' : score >= 60 ? '🟡' : '🔴';

              comment += `${emoji} **Overall Health: ${score}/100**\n\n`;

              if (health.healthScore) {
                comment += '### Category Scores\n\n';
                comment += `- Testing: ${health.healthScore.testing}/100\n`;
                comment += `- CI/CD: ${health.healthScore.ci}/100\n`;
                comment += `- Type Safety: ${health.healthScore.typeSafety}/100\n`;
                comment += `- Code Quality: ${health.healthScore.quality}/100\n`;
                comment += `- Security: ${health.healthScore.security}/100\n`;
                comment += `- Documentation: ${health.healthScore.documentation}/100\n\n`;
              }

              if (health.critical?.length > 0) {
                comment += `### 🔴 Critical Issues (${health.critical.length})\n\n`;
                health.critical.slice(0, 3).forEach(issue => {
                  comment += `- ${issue.message}\n`;
                });
                if (health.critical.length > 3) {
                  comment += `\n_... and ${health.critical.length - 3} more_\n`;
                }
                comment += '\n';
              }

              if (health.quickWins?.length > 0) {
                comment += `### 💡 Quick Wins (${health.quickWins.length})\n\n`;
                comment += 'Run `npm run doctor -- --fix` to apply automatic fixes.\n\n';
              }

              if (health.unscoredCategories?.length > 0) {
                comment += '### ⚠️ Not reflected in the score\n\n';
                comment += `Unmapped gap categories: ${health.unscoredCategories.join(', ')}\n\n`;
              }
            } catch (e) {
              comment += '⚠️ Unable to generate health report.\n\n';
              comment += `Error: ${e.message}\n\n`;
            }

            comment += '---\n*Health check by DevEnvTemplate Doctor*';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('DevEnvTemplate Health Check')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      # Surfaces a doctor crash (as opposed to a low score) as a failure.
      - name: Fail if the doctor could not run
        if: always()
        run: |
          if [ ! -s .devenv/health.json ]; then
            echo "::error::The doctor produced no report - it failed to run."
            exit 1
          fi
          echo "Doctor produced a report (exit code was ${{ steps.doctor.outcome }})."

  # All checks passed
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [quick-checks, test, security]
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.quick-checks.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All checks passed!"
