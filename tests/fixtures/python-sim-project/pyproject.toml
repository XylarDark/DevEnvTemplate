[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-sim-project"
version = "0.1.0"
description = "Fixture project for DevEnvTemplate python stack detection tests"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "matplotlib>=3.6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "black>=23.0.0",
  "ruff>=0.4.0",
  "mypy>=1.0.0"
]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

